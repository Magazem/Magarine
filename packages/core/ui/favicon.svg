<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 35 35" width="32" height="32">
<title>Magarine</title>
<!-- One agent organism, drawn the way ui/organism.js draws one: a 5x5 grid of
     cells, the ring family (hollow middle) with quad symmetry. Cell colour is
     fixed here because a favicon has no ticket status to take one from. -->
<rect width="35" height="35" rx="5" fill="#000"/>
<g fill="#55B6FF" shape-rendering="crispEdges"><rect x="10" y="5" width="5" height="5"/><rect x="15" y="5" width="5" height="5"/><rect x="20" y="5" width="5" height="5"/><rect x="5" y="10" width="5" height="5"/><rect x="15" y="10" width="5" height="5"/><rect x="25" y="10" width="5" height="5"/><rect x="5" y="15" width="5" height="5"/><rect x="10" y="15" width="5" height="5"/><rect x="20" y="15" width="5" height="5"/><rect x="25" y="15" width="5" height="5"/><rect x="5" y="20" width="5" height="5"/><rect x="15" y="20" width="5" height="5"/><rect x="25" y="20" width="5" height="5"/><rect x="10" y="25" width="5" height="5"/><rect x="15" y="25" width="5" height="5"/><rect x="20" y="25" width="5" height="5"/></g>
</svg>
